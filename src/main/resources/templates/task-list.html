<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task List</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation Bar -->
    <nav class="bg-blue-600 p-4 shadow-lg mb-6">
        <div class="flex justify-between">
            <h1 class="text-white text-lg font-bold">Task Manager</h1>
            <div>
                <a href="/" class="text-white hover:underline px-4">Home</a>
                <a href="/tasks" class="text-white hover:underline px-4">Task List</a>
                <a href="/logout" class="text-white hover:underline px-4">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mx-auto p-6">

        <h1 class="text-3xl font-bold mb-4">Task List</h1>

        <!-- Navigation Buttons -->
        <div class="flex justify-between mb-4">
            <div></div>
            <a href="/tasks/new" class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500 transition">Create New Task</a>
        </div>

        <!-- Task Table -->
        <div class="overflow-x-auto mt-6">
            <table class="min-w-full bg-white border border-gray-300 rounded-lg shadow-lg">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="py-2 px-4 border-b border-gray-300 text-left">Title</th>
                        <th class="py-2 px-4 border-b border-gray-300 text-left">Description</th>
                        <th class="py-2 px-4 border-b border-gray-300 text-left">Status</th>
                        <th class="py-2 px-4 border-b border-gray-300 text-left">Due Date</th>
                        <th class="py-2 px-4 border-b border-gray-300 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="task : ${tasks}">
                        <td class="py-2 px-4 border-b border-gray-300" th:text="${task.title}"></td>
                        <td class="py-2 px-4 border-b border-gray-300" th:text="${task.description}"></td>
                        <td class="py-2 px-4 border-b border-gray-300" th:text="${task.status}"></td>
                        <td class="py-2 px-4 border-b border-gray-300" th:text="${task.dueDate}"></td>
                        <td class="py-2 px-4 border-b border-gray-300">
                            <a th:href="@{'/tasks/view/' + ${task.id}}" class="text-blue-600 hover:underline">View</a>
                            <a th:href="@{'/tasks/edit/' + ${task.id}}" class="text-green-600 hover:underline ml-2">Edit</a>
                            <a th:href="@{'/tasks/delete/' + ${task.id}}" class="text-red-600 hover:underline ml-2">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tasks)}">
                        <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                            No tasks available. Start by creating a new task!
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
