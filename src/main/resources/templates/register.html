<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- Font Awesome for icons -->
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white p-10 rounded-lg shadow-lg"> <!-- Increased padding for a spacious feel -->
        <h2 class="text-3xl font-bold text-center text-blue-600 mb-6">Create an Account</h2> <!-- Changed text color to blue -->
        
        <!-- Registration form -->
        <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-6">
            <!-- Username field -->
            <div class="space-y-1">
                <label for="username" class="block text-sm font-medium text-gray-700">Username:</label>
                <input type="text" id="username" th:field="*{username}" required
                       class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out sm:text-sm" placeholder="Enter your username">
            </div>

            <!-- Password field -->
            <div class="space-y-1">
                <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                <input type="password" id="password" th:field="*{password}" required
                       class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out sm:text-sm" placeholder="Enter your password">
            </div>

            <!-- Confirm Password field -->
            <div class="space-y-1">
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-150 ease-in-out sm:text-sm" placeholder="Re-enter your password">
            </div>

            <!-- Submit button -->
            <div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md shadow-md hover:bg-blue-500 transition duration-200 ease-in-out">
                    Register
                </button>
            </div>
        </form>

        <!-- Error alert (shown if there is a registration error) -->
        <div th:if="${error}" class="mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Login link -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Already have an account? 
                <a th:href="@{/login}" class="text-blue-600 hover:underline font-medium">Login here</a>.
            </p>
        </div>
    </div>
</body>
</html>
