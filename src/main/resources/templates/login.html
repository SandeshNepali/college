<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- Font Awesome for icons -->
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md bg-white p-12 rounded-lg shadow-lg">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <img th:src="@{logo.png}" alt="Logo" class="h-32 w-auto"> <!-- Ensure the path is correct -->
        </div>
        <h2 class="text-4xl font-bold text-center text-blue-600 mb-2">Task Manager</h2>
        <p class="text-center text-gray-600 mb-6">Please log in to your account.</p>
        
        <!-- Login form -->
        <form th:action="@{/login}" th:object="${user}" method="post" class="space-y-6">
            <!-- Username field -->
            <div class="space-y-1">
                <label for="username" class="flex items-center text-sm font-medium text-gray-700">
                    <i class="fas fa-user-circle mr-2 text-blue-600"></i> Username:
                </label>
                <input type="text" id="username" th:field="*{username}" required
                       class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition duration-150 ease-in-out sm:text-sm" placeholder="Enter your username">
            </div>

            <!-- Password field -->
            <div class="space-y-1">
                <label for="password" class="flex items-center text-sm font-medium text-gray-700">
                    <i class="fas fa-lock mr-2 text-blue-600"></i> Password:
                </label>
                <input type="password" id="password" th:field="*{password}" required
                       class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition duration-150 ease-in-out sm:text-sm" placeholder="Enter your password">
            </div>

            <!-- Submit button -->
            <div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md shadow-md hover:bg-blue-500 transition duration-200 ease-in-out">
                    Log In
                </button>
            </div>
        </form>

        <!-- Error alert (shown if there is a login error) -->
        <div th:if="${error}" class="mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- Register link -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">Don't have an account? 
                <a th:href="@{/register}" class="text-blue-600 hover:underline font-medium">Register here</a>.
            </p>
        </div>
    </div>
</body>
</html>
