<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Navigation Bar -->
    <nav class="bg-blue-600 p-4 shadow-lg mb-6">
        <div class="flex justify-between">
            <h1 class="text-white text-lg font-bold">Task Manager</h1>
            <div>
                <a href="/" class="text-white hover:underline px-4">Home</a>
                <a href="/tasks" class="text-white hover:underline px-4">Task List</a>
                <a href="/logout" class="text-white hover:underline px-4">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto">

        <!-- Welcome Message -->
        <div class="bg-gradient-to-r from-blue-500 to-blue-700 text-white p-8 rounded-lg shadow-lg mb-6 text-center">
            <h2 class="text-3xl font-extrabold mb-2">Hello, <span th:text="${username}">User</span>!</h2>
            <p class="mt-2 text-lg">Your task management journey starts here!</p>
            <div class="mt-4 flex justify-center">
                <a href="/tasks" class="bg-white text-blue-600 font-semibold px-4 py-2 rounded-full shadow hover:bg-gray-100 transition">View Tasks</a>
            </div>
        </div>
        

        <!-- Tasks Overview -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="px-6 py-4">
                <h3 class="text-xl font-semibold mb-4">Your Tasks</h3>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100" th:if="${!#lists.isEmpty(tasks)}">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Due Date</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="task : ${tasks}">
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.title}">Task Title</td>
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.description}">Task Description</td>
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.status}">Task Status</td>
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.dueDate}">Task Due Date</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tasks)}">
                            <td colspan="4" class="px-6 py-4 text-center text-gray-500">
                                No tasks available.
                            </td>
                        </tr>
                    </tbody>
                </table>
                
            </div>
        </div>

    </div>
</body>
</html>
