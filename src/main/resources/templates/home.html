<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="antialiased">
    <div class="container mx-auto px-4">
        <div class="bg-blue-600 text-white p-6 rounded-lg shadow-lg mb-4 text-center">
            <h2 class="text-2xl font-bold">Welcome, <span th:text="${username}">User</span>!</h2>
            <p class="mt-2">Here are your tasks:</p>
        </div>

        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="px-6 py-4">
                <h3 class="text-xl font-semibold mb-4">Your Tasks</h3>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Due Date</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="task : ${tasks}">
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.title}">Task Title</td>
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.description}">Task Description</td>
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.status}">Task Status</td>
                            <td class="px-6 py-4 whitespace-nowrap" th:text="${task.dueDate}">Task Due Date</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-4">
            <a href="/logout" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-500 transition">Logout</a>
        </div>
    </div>
</body>
</html>
